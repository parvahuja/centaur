name: Publish staging Console

on:
  push:
    branches: [staging/mercator-console-test]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    if: github.repository == 'parvahuja/centaur'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build Console
        run: |
          docker build --label org.opencontainers.image.source=https://github.com/parvahuja/centaur \
            --label org.opencontainers.image.revision="$GITHUB_SHA" \
            -t "ghcr.io/parvahuja/centaur-console:sha-${GITHUB_SHA}" services/console
      - name: Publish Console
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "ghcr.io/parvahuja/centaur-console:sha-${GITHUB_SHA}"
